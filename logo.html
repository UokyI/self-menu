<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Sub Menu Logo</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1116; color: #e6e6e6; margin: 0; padding: 16px; min-height: calc(100vh - 32px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  p.desc { color: #9d9d9d; font-size: 13px; margin: 0 0 28px; text-align: center; }
  .cards { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { background: #1a1d24; border: 1px solid #2b2f38; border-radius: 10px; padding: 24px; }
  .card h2 { font-size: 13px; color: #9d9d9d; font-weight: normal; margin: 0 0 12px; }
  .row { margin-bottom: 16px; }
  .row .label { display: block; font-size: 12px; color: #808080; margin-bottom: 6px; }
  button { background: #007acc; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-right: 8px; }
  button:hover { background: #005f9e; }
  .checker { background-image: linear-gradient(45deg,#2b2f38 25%,transparent 25%), linear-gradient(-45deg,#2b2f38 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#2b2f38 75%), linear-gradient(-45deg,transparent 75%,#2b2f38 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; display: inline-block; padding: 16px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Self Sub Menu — Logo</h1>
  <p class="desc">128&times;128（SVG 矢量，可任意缩放）。下载后可直接作为 VS Code 扩展图标上传。</p>

  <div class="card">
    <h2>预览（棋盘格展示透明背景）</h2>
    <div class="checker">
      <div id="preview"></div>
    </div>
  </div>

  <div class="card">
    <h2>下载</h2>
    <div class="row">
      <span class="label">SVG（矢量，推荐，任意尺寸清晰）</span>
      <button onclick="downloadSVG()">下载 logo.svg</button>
    </div>
    <div class="row">
      <span class="label">PNG（位图，128&times;128）</span>
      <button onclick="downloadPNG()">下载 logo.png</button>
    </div>
    <div class="row">
      <span class="label">PNG（位图，512&times;512 高清）</span>
      <button onclick="downloadPNG(512)">下载 logo-512.png</button>
    </div>
  </div>

<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- terminal prompt -->
  <path d="M40 38 L54 50 L40 62" stroke="#22c55e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="62" y1="62" x2="88" y2="62" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
  <!-- menu list bars -->
  <line x1="36" y1="78" x2="92" y2="78" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <line x1="36" y1="90" x2="74" y2="90" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>`;

function render() {
  document.getElementById('preview').innerHTML = svg;
}
render();

function svgBlob() {
  return new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
}

function downloadSVG() {
  const url = URL.createObjectURL(svgBlob());
  const a = document.createElement('a');
  a.href = url;
  a.download = 'logo.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function downloadPNG(size = 128) {
  const img = new Image();
  const url = URL.createObjectURL(svgBlob());
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = size === 128 ? 'logo.png' : 'logo-512.png';
    a.click();
  };
  img.src = url;
}
</script>
</body>
</html>
